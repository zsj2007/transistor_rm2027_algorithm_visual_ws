# configs/infantry.yaml — 步兵配置（transistor src/shared_files/config.yaml 完整迁移）
# 路径以项目根为基准：模型在 assets/models/，测试视频在 assets/InputVideo/
# 原AutoAimMacro参数
SAVE_IMG_FREQ : 0 # 0为不保存图片，其他值为保存图片的频率
SYNC_CAMERA_FPS : true # 定义后主循环帧数将不会超过摄像头实际捕获帧数
FIX_ENEMY_COLOR : 1 # 0为红色，1为蓝色
FIX_BULLET_VELOCITY : -1.0 # >=0时强制覆盖电控弹速；<0表示不强制覆盖
LOG_RESULT_VIDEO : false # 定义后将以视频形式记录处理结果
LOG_ORIGIN_VIDEO : false # 定义后将记录处理的原始画面视频

USE_VIDEO : false # 使用视频输入
USE_IMAGES : false # 使用图片集输入
DEBUG_CODE : false # 是否在初始化后运行debug代码
FILTER_ARMOR_CLASS : 0 # 装甲板类别过滤掩码，0表示不过滤（如0b00000001过滤0号类别）
FIX_ARMOR_CLASS : -1 # 强制装甲板类别，-1表示不强制，0~7表示强制为对应类别

# SharedMemoryClassifier参数（多进程共享内存窗口）
CLASSIFIER_SHM_KEY : 0x0250
classifier_model_relative_path : "assets/models/model_rm2026_openvino/model.xml"

use_RP24_YOLO : true # 改为 true 启用 YOLO 检测管线（当前为同济 yolov5）
RP24_YOLO_model_relative_path : "assets/models/RP24_YOLO/0526_dynamic.xml" # RP24 0526 动态模型 IR（分辨率可调 320/512/640，须能被 32 整除；用 .onnx 首次运行会自动转 IR）
RP24_YOLO_device : "CPU"
RP24_YOLO_model_family : "rp24" # rp24 或 tongji_yolov5（同济模型颜色/类别语义不同）
RP24_YOLO_letterbox : false # 同济模型用 letterbox；rp24/0526 模型训练时是拉伸，需保持一致
RP24_YOLO_input_size : 640 # 模型输入边长（动态模型支持 320/512/640，须能被 32 整除；降分辨率提帧率，需重新标定）
RP24_YOLO_infer_threads : 8 # 推理总线程数（基线：全核自由调度时 8 线程 ≈10.8ms）
RP24_YOLO_infer_streams : 1 # 并发推理请求数（本机 4 个物理 P 核撑不起 2 流）

# 下发通道：serial（原串口角度协议 0x42 0x52 0xCD）| torque（TorqueController MPC 力矩协议）
# torque 通道由 ~/TorqueController 的 RobotController 接管 MCU/IMU 串口、融合与 100Hz 发送，
# 此时不再使用旧的 io::Communication 串口，传感器状态改由 TorqueController 融合结果提供。
command_channel : "torque"
serial_port : "" # 电控主串口，如 "/dev/ttyACM1"；留空 = 自动检测（跳过产品名含 IMU 的口）
log_send_commands : true # true 时每帧把实际下发的 pitch/yaw/fire 打到控制台（实车排障可临时打开）
no_target_hold_position : true # 无目标时：false=回 0 位（原行为），true=保持最后位置不动

# TorqueController 参数（command_channel=torque 时使用，默认值与 ~/TorqueController/src/control_demo.cpp 一致）
torque_controller:
  dt_control : 0.01            # 控制周期 s（后台 100Hz 发送）
  mpc_pred_N : 20              # MPC 预测步数（yaw 目标延迟 = dt_control × N = 0.2s，有意设计）
  state_delay_ms : 20.0        # 状态反馈延迟对齐（torque 通道独立配置，默认 20ms；serial 通道用顶层 serial_delay_time）
  J : 0.016541                 # 辨识参数：转动惯量
  tau_c : 0.097297             # 辨识参数：库仑摩擦
  b : 0.0321                   # 辨识参数：粘滞摩擦
  tau_d : 0.0                  # 辨识参数（通常置 0）
  max_torque : 1.0             # N·m
  max_torque_rate : 40.0       # N·m/s
  Q : 5.0                      # MPC 权重
  R : 0.01
  Rd : 0.1
  max_iter : 30                # MPC 最大迭代
  integral_gain : 0.01         # yaw 力矩积分补偿比例系数
  yaw_torque_only_mode : false # 仅力矩控制模式
  integral_enable : false      # 是否启用 yaw 力矩积分补偿
  sequence_mode : false        # 是否使用序列模式（暂未接入）
  # MCU 数据线性标定（默认 = Infantry1 当前标定；其他车参考 ~/TorqueController/data/cars/*/LinearParams.txt）
  send_pitch_scale : 20.523245
  send_pitch_offset : 0.475049
  recv_pitch_scale : 1.122635
  recv_pitch_offset : -0.170755

# ArmorDetect_Node 参数
init_enemy_color : "BLUE" # 初始敌方颜色，连接至电控后会自动获取敌方颜色并覆盖此值
max_armor_position_height : 1500.0 # 最大装甲板高度，超过此值视为无效

camera_ExposureTime : 2000.0 # 临时诊断：夜晚环境光暗，先拉高曝光验证画面能否变亮；帧率会降到 ~10fps
camera_Gain : 23.0 # 本相机增益范围 0~23.98，超过上限会导致连接失败
bullet_velocity_ : 15.0 # 初始弹速，连接至电控后会自动获取实时弹速并覆盖此值
# 相机光心相对枪口的偏移（xyz分别为相机系下向右、向前、向上）
delta_x_ : 50.0
delta_y_ : -50.0
delta_z_ : 30.0

pc_ip : "192.168.10.25"
cam_ip : "192.168.10.10"

video_relative_path : "assets/InputVideo/infantry_blue.mp4" # 使用视频输入时的视频路径
images_relative_path : "assets/InputImages" # 使用图片输入时的图片文件夹路径

RMM_visualize_zoom_out_factor : 10.0 # 平面可视化缩放系数，该值越大视野范围越大

# Persistent physical-target lifecycle for SuperPower EKF.
target_manager:
  min_detect_frames: 5
  max_temp_lost_frames: 15
  outpost_max_temp_lost_frames: 75
  enable_priority_switch: false

# Validated normal four-armor SuperPower EKF adapter settings.
superpower_ekf:
  min_detect_count: 3
  max_temp_lost_count: 10
  max_dt_s: 0.1
  initial_radius_m: 0.38
  armor_num: 4
  comparison:
    enabled: false
  joint_update:
    enabled: false
    min_consecutive_frames: 2

# 可视化设置
visualizer:
  enable: true # 是否启用可视化
  show_windows: true # 是否显示窗口（由独立 visualizer 进程读取）
  publish_topics: true # 是否发布调试帧到共享内存（替代 ROS 话题，供 visualizer 进程读取）
  shm_key: 0x0251 # 可视化共享内存 key（与 visualizer 进程保持一致）
  log_video: true # 是否录制视频
  draw:
    joint_ekf_pair: true

frame_rate : 45.0 # fps；输入应≤流水线处理能力，否则队列积压拉高端到端延迟（相机模式受链路帧率限制，此值仅作上限）
serial_delay_time : 30.0 # ms 电控传来的信息相对相机画面快的时间，将对电控信息再延迟这个时间以同步两者
extra_predict_time : 0.170 # s 除了弹丸飞行时间以外的需要预测器补偿的总时间

# 自瞄流水线耗时统计
performance_monitor_enabled : true
performance_monitor_report_interval : 90 # 累计多少帧输出一次平均耗时

# 线程池参数
thread_pool_size : 0 # 全局线程池线程数，0=自动（逻辑核数）

# ============ CPU 绑核配置（不同电脑需按实际拓扑调整） ============
# 本机（Intel Core Ultra 5 125H）：4 个 P 核（逻辑 CPU 0-7，最高 4.5GHz，含超线程）
#   + 8 个 E 核（逻辑 CPU 8-15，3.6GHz）+ 2 个低功耗 E 核（16-17，留给系统）。
# 查看任意机器：lscpu -e=CPU,CORE,MAXMHZ
cpu_pinning:
  enabled: false             # 本机 4P+8E：P 核太少，绑核反而拖慢推理（36ms vs 10.8ms）
  other_cores: "8-15"              # 主线程/线程池/流水线/IO 等“其余线程”绑定的 E 核
  yolo_cores: ""                   # 空 = 不用 YOLO 专用 P 核池
  yolo_pool_threads: 0             # 0 = 不用 YOLO 专用池
  yolo_core_type: "any"            # OpenVINO 不限定 P/E 核（any / pcore / ecore）
  yolo_enable_cpu_pinning: false   # 不固定推理线程
  yolo_enable_hyper_threading: true

pre_predict_time_not_aim : 500.0 # ms 在看到目标的这段时间内不启动自瞄
pre_predict_time : 200000000.0 # ms 在看到目标的这段时间内直接瞄准当前装甲板位置，待有足够观测值后再使用预测值
reset_predictor_time : 1000.0 # ms 超过这段时间未观测到某一类装甲板，将停止这一类装甲板的预测并重置预测器

# 控制PID参数
pitch_integration_max_degree : 20.0
pitch_integration_min_degree : -20.0
yaw_integration_max_degree : 20.0
yaw_integration_min_degree : -20.0
command_picth_kp: 1.0
command_picth_integration_speed: 0.0
command_picth_integration_max_speed_degree: 5.0
command_yaw_kp: 1.0
command_yaw_integration_speed: 0.00
command_yaw_integration_max_speed_degree: 5.0

# 火控设置
after_target_change_ceasefire_ms : 300
before_target_change_ceasefire_ms : 100
aim_center_vyaw_upper_threshold : 2.5
aim_center_vyaw_lower_threshold : 2.0
aim_center_yaw_bias_expand : 0.0
low_vyaw_change_target_delta_yaw_threshold_degree : 30.0
low_vyaw_threshold : 0.3
choose_armor_yaw_bias_degree : 15.0

# Params.h 参数设置
min_light_height : 8
light_min_area : 3
light_max_area : 4096
max_light_wh_ratio : 100.0
min_light_wh_ratio : 1
light_max_tilt_angle : 60.0

# LightBarDetector 参数
binary_img_THRESHOLD : 180
subtract_value : 120
color_rect_expand_FACTOR : 1.5
mean_color_diff_THRESHOLD_BLUE : 20.0
mean_color_diff_THRESHOLD_RED : 10.0
THRES_MAX_COLOR_RED : 60
THRES_MAX_COLOR_BLUE : 100
light_bar_max_angle : 30.0

# ArmorDetector 参数
corners_expand_ratio : 1.5 # 装甲板角点坐标扩大比例
corners_narrow_ratio : 0.8
is_ture_yolo_armor_brightness_ratio : 1.0
height_correct_ratio_small : 1.22 # 角点坐标修正比例系数
width_correct_ratio_small : 1.12
height_correct_ratio_large : 1.26
width_correct_ratio_large : 1.06
max_angle_diff : 22.5 # 最大角度差
max_height_diff_ratio : 0.65 # 最大高度差比例
max_length_direction_mismatch_ratio : 1.5 # 最大长度方向错位比例
min_light_distance : 5.0 # 最小灯条距离
max_light_distance : 50.0 # 最大灯条距离
min_armor_confidence : 0.3 # 最小置信度阈值

camera_matrix: # 相机内参矩阵
  - [1.31280460e+03, 0.00000000e+00, 6.38736364e+02]
  - [0.00000000e+00, 1.31309593e+03, 5.34133502e+02]
  - [0.00000000e+00, 0.00000000e+00, 1.00000000e+00]
dist_coeffs: [-0.05392145, -0.02516686, -0.00222499, -0.00149047, 0.43693918] # 畸变系数
max_expected_small_distance_mismatch_ratio : 0.35
max_expected_large_distance_mismatch_ratio : 0.7

# ArmorClassifier 参数
MAX_ROI_SAVE_COUNT : 20000
classify_classes : 8
IS_ARMOR_THRESHOLD : 0.5
IS_LARGE_THRESHOLD : 0.5
CLASSIFY_THRESHOLD : 0.5
INPUT_HEIGHT : 48
INPUT_WIDTH : 64
MAX_TRACKING_AGE_MS : 100 # 最大跟踪时间100ms
MIN_TRACKING_COUNT : 1 # 临时测试：相机帧率低+检出断帧，原值2导致追踪器永远确认不了目标；验证后调回2
IS_NEAR_MAX_DIST_RATIO : 1.5
armor_tracker_fit_step : 5
armor_tracker_predict_step : 5
